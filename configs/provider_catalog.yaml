currency: USD
units: per_million_tokens
notes:
- Public documentation and endpoint metadata were inspected; this is not proof of account access or a live
  completion. No paid test calls were made.
- All prices are dated USD per million tokens. Native batch prices apply only when the native batch API completes
  the request.
- OpenRouter backend, precision and service tier are pinned. No provider or model fallback is permitted.
- Model architecture and parameter counts are provider-reported; undisclosed values remain unknown. This pool
  does not isolate architecture effects from training or serving differences.
- Original v0.1 catalogue retained under docs/provider_sources for profile provenance. A changed provider/precision
  creates a different experimental configuration.
