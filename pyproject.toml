[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heerbench"
version = "0.3.0"
description = "Reproducible ABF dependency evaluation for military command and staff decision support"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "PyYAML==6.0.3", "jsonschema==4.26.0", "numpy==2.3.5"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
plots = ["matplotlib==3.10.8"]
tokenizers = ["tokenizers==0.22.1"]
proxy = ["httpx[socks]==0.28.1"]

[project.scripts]
heerbench = "heerbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

